# Import reviewed ChatGPT observations; no requests to HyRead.
# GitHub-hosted runners only validate and merge source data supplied in Git.
name: Import verified ChatGPT HyRead batch
on:
  push:
    paths:
      - 'data/assisted-batches/*.json'
permissions:
  contents: write
concurrency:
  group: hyread-assisted-batch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Regression tests
        run: python -m unittest discover -s tests -q
      - name: Identify one newly submitted ChatGPT batch
        id: batch
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo 'Cannot verify the previous commit; refusing to guess the batch file.'
            exit 1
          fi
          mapfile -t batches < <(git diff --name-only --diff-filter=A "$BEFORE" "$AFTER" -- 'data/assisted-batches/*.json')
          if [ "${#batches[@]}" -ne 1 ] || [ ! -f "${batches[0]:-}" ]; then
            echo 'Exactly one new assisted batch JSON is required per push.'
            exit 1
          fi
          echo "batch_path=${batches[0]}" >> "$GITHUB_OUTPUT"
      - name: Validate and apply this reviewed observation batch
        env:
          BATCH_PATH: ${{ steps.batch.outputs.batch_path }}
        run: |
          python -m src.assisted_update "$BATCH_PATH" --dry-run
          python -m src.assisted_update "$BATCH_PATH" --apply
      - name: Commit generated state and published site data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/history.json docs/data/catalog.json docs/data/update-report.json docs/data/status.json
          if ! git diff --cached --quiet; then
            git commit -m "data: apply reviewed ChatGPT HyRead magazine batch"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
