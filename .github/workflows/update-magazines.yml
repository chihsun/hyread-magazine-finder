# The HyRead endpoints returned HTTP 403 from GitHub runners on 2026-10-30.
# Deliberately no schedule and no scraper execution: assisted updates are
# reviewed and committed via ChatGPT + GitHub connector instead.
name: Validate HyRead assisted updates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Explain update process
        run: |
          echo 'No HyRead request was made. See docs/ASSISTED_UPDATE.md.' >> "$GITHUB_STEP_SUMMARY"
