# The HyRead endpoints returned HTTP 403 from GitHub runners on 2026-10-30.
# No schedule and no scraping. Book lists are manually collected and merged locally.
name: Validate HyRead catalog data
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docs/app.js'
      - '.github/workflows/update-magazines.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'docs/app.js'
      - '.github/workflows/update-magazines.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: JavaScript syntax
        run: node --check docs/app.js
      - name: Frontend future issue filter regression
        run: node tests/test_v161_web.js
      - name: Update title change list regression
        run: node tests/test_update_ui.js
      - name: Compact layout and library card regression
        run: node tests/test_layout_ui.js
      - name: Explain update process
        run: |
          echo 'Tests only: no HyRead request. Catalog updates are collected and merged locally.' >> "$GITHUB_STEP_SUMMARY"
