name: Weekly HyRead magazine update
on:
  schedule:
    # 08:00 Friday Asia/Taipei = 00:00 Friday UTC; Actions may start later.
    - cron: '0 0 * * 5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hyread-weekly-update
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Crawl nine libraries (3 extra retries PER LIBRARY)
        id: crawl
        continue-on-error: true
        run: python -m src.update --once
      - name: Commit validated updates (including partial failure status)
        if: always() && steps.crawl.outcome != 'skipped'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state.json data/history.json docs/data/catalog.json docs/data/status.json docs/data/update-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh HyRead magazine catalog and health status'
            git push
          fi
      - name: Report stale libraries in Actions
        if: steps.crawl.outcome == 'failure'
        run: |
          echo 'One or more library scans failed; last good data was retained.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
